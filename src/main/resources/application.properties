spring.application.name=Mzansi-connect-backend


# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taxi_route_planner_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Johannesburg}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
# The database tables are managed manually in MySQL Workbench.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=${SERVER_PORT:8080}

# React frontend
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# JWT authentication
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
